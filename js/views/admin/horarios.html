<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Horarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-light">

<div class="container py-4">
  <h2 class="text-center mb-3">Gestión de Horarios</h2>
  <button class="btn btn-primary mb-3" id="btnPDF">Generar PDF de Reservas</button>
  <div id="calendar"></div>
</div>

<!-- Modal de Reserva -->
<div class="modal fade" id="modalEvento" tabindex="-1" aria-labelledby="modalEventoLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="formEvento">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalEventoLabel">Agregar / Editar Reserva</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label class="form-label">Materia</label>
            <select class="form-select mb-2" id="materia" required></select>
  
            <label class="form-label">Docente</label>
            <select class="form-select mb-2" id="profesor" required></select>
  
            <div class="mb-2">Participantes:</div>
            <input type="text" class="form-control mb-1" id="persona1" placeholder="Nombre 1">
            <input type="text" class="form-control mb-1" id="persona2" placeholder="Nombre 2">
            <input type="text" class="form-control mb-1" id="persona3" placeholder="Nombre 3">
            <input type="text" class="form-control mb-1" id="persona4" placeholder="Nombre 4">
            <input type="time" class="form-control my-2" id="horaInicio" required>
            <input type="time" class="form-control" id="horaFin" required>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  
  

<!-- Modal de alerta -->
<div class="modal fade" id="modalAlerta" tabindex="-1" aria-labelledby="modalAlertaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content border-warning">
      <div class="modal-header bg-warning">
        <h5 class="modal-title">Advertencia</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalAlertaMensaje"></div>
      <div class="modal-footer">
        <button class="btn btn-outline-warning" data-bs-dismiss="modal">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<!-- Importación del sistema modular -->
<script type="module" src="../../../js/controllers/HorarioController.js"></script>
</body>
</html>
