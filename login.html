<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body class="bg-light">

  <main class="container mt-5 login-contenedor">
    <h1 class="mb-4 text-center">Inicio de Sesión</h1>

    <div id="mensaje" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="loginCorreo" class="form-label">Correo electrónico</label>
        <input type="email" id="loginCorreo" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">Contraseña</label>
        <input type="password" id="loginPassword" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
    </form>
  </main>

  <script type="module" src="./js/controllers/LoginController.js"></script>
</body>
</html>
