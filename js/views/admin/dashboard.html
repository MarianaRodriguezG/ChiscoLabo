<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin</title>
  <link rel="stylesheet" href="../../../css/estilos.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container mt-5">
    <h1 class="mb-3">Panel del Administrador</h1>
    <p>Bienvenido/a, <span id="usuarioCorreo"></span></p>
    <a href="../../../login.html" class="btn btn-danger mt-3" onclick="cerrarSesion()">Cerrar sesión</a>
  </main>

  <script type="module">
    import { protegerVista } from "../../../js/views/auth.js";
    protegerVista("admin");

    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));
    document.getElementById("usuarioCorreo").textContent = usuario.correo;

    window.cerrarSesion = () => {
      localStorage.removeItem("usuarioActivo");
    };
  </script>
</body>
</html>
