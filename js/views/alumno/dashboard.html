<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel del Alumno</title>
  <link rel="stylesheet" href="../../../css/estilos.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container mt-5">
    <h1 class="mb-3">Panel del Alumno</h1>
    <p>Hola, <span id="usuarioCorreo"></span></p>
    <a href="../../../logout.html" class="btn btn-danger mt-3">Cerrar sesión</a>
  </main>

  <script type="module">
    import { protegerVista } from "../../../js/auth.js";
    protegerVista("alumno");  // Asegura que el rol sea "alumno"

    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));
    if (usuario) {
      document.getElementById("usuarioCorreo").textContent = usuario.correo;
    }
  </script>
</body>
</html>
