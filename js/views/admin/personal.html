<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/estilos.css" />
</head>
<body class="bg-light">

  <main class="container my-4">
    <header class="mb-4">
      <h1>Gestión de Personal</h1>
    </header>

    <!-- Sección: Formulario -->
    <section class="card mb-4" aria-labelledby="titulo-registro">
      <header class="card-header">
        <h2 id="titulo-registro" class="h5">Registrar nuevo personal</h2>
      </header>
      <div class="card-body">
        <form id="formPersonal">
          <div class="row g-3">
            <div class="col-md-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" id="nombre" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label for="correo" class="form-label">Correo</label>
              <input type="email" id="correo" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label for="rol" class="form-label">Rol</label>
              <select id="rol" class="form-select" required>
                <option value="">Seleccione un rol</option>
                <option value="admin">Administrador</option>
                <option value="docente">Docente</option>
                <option value="laboratorista">Laboratorista</option>
                <option value="tecnico">Técnico</option>
              </select>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Filtro de estado -->
    <div class="d-flex justify-content-end mb-2">
      <label class="me-2 fw-bold" for="filtroEstado">Filtrar:</label>
      <select id="filtroEstado" class="form-select w-auto">
        <option value="todos">Todos</option>
        <option value="activos">Activos</option>
        <option value="inactivos">Inactivos</option>
      </select>
    </div>

    <!-- Tabla de personal -->
    <section class="card" aria-labelledby="titulo-tabla">
      <header class="card-header">
        <h2 id="titulo-tabla" class="h5">Listado de Personal</h2>
      </header>
      <div class="card-body p-0">
        <table class="table table-striped mb-0" id="tablaPersonal">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Filas generadas por JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../../js/controllers/PersonalController.js"></script>

</body>
</html>
