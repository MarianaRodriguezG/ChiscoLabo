<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Usuarios</title>
  <link rel="stylesheet" href="../../../css/estilos.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container my-4">
    <header class="mb-4">
      <h1>Gestión de Usuarios</h1>
    </header>

    <!-- Registro -->
    <section class="card mb-4">
      <header class="card-header">
        <h2 class="h5">Registrar nuevo usuario</h2>
      </header>
      <div class="card-body">
        <form id="formUsuario" class="row g-3">
          <div class="col-md-6">
            <label for="correo" class="form-label">Correo</label>
            <input type="email" id="correo" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="rol" class="form-label">Rol</label>
            <select id="rol" class="form-select" required>
              <option value="usuario">Usuario</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <div class="text-end">
            <button type="submit" class="btn btn-primary mt-3">Registrar</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Tabla de usuarios -->
    <section class="card">
      <header class="card-header">
        <h2 class="h5">Listado de Usuarios</h2>
      </header>
      <div class="card-body p-0">
        <table class="table table-striped mb-0" id="tablaUsuarios">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Cuerpo dinámico -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="../../../js/controllers/UsuarioController.js"></script>
</body>
</html>
