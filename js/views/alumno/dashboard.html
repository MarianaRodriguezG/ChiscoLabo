<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Usuario</title>
  <link rel="stylesheet" href="../../../css/estilos.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container mt-5">
    <header class="mb-4">
      <h1>Panel del Usuario</h1>
      <p>Hola, <span id="usuarioCorreo" class="fw-bold"></span></p>
    </header>

    <!-- Contenido limitado para el alumno -->
    <section>
      <p class="text-muted">Aquí solo podrás consultar tus horarios y realizar reservas.</p>
    </section>

    <a href="../../../logout.html" class="btn btn-danger mt-3">Cerrar sesión</a>
  </main>

  <script type="module">
    import { protegerVista } from "../../../js/auth.js";
    protegerVista("usuario");

    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));
    document.getElementById("usuarioCorreo").textContent = usuario.correo;
  </script>
</body>
</html>
