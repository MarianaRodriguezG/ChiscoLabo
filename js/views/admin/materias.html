<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Materias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../../css/estilos.css" />
</head>
<body class="bg-light">

  <main class="container my-4">
    <header class="mb-4">
      <h1>Gestión de Materias</h1>
    </header>
    <div class="text-end mt-3">
      <button id="btnExportarExcel" class="btn btn-success">Exportar a Excel</button>
      <button id="btnExportarPDF" class="btn btn-danger">Exportar a PDF</button>
    </div>
    
    <!-- Sección: Registro de Materia -->
    <section class="card mb-4" aria-labelledby="titulo-registro">
      <header class="card-header">
        <h2 id="titulo-registro" class="h5">Registrar nueva materia</h2>
      </header>
      <div class="card-body">
        <form id="formMateria">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="nombreMateria" class="form-label">Nombre de la materia</label>
              <select id="nombreMateria" class="form-select" required>
                <option value="">Seleccionar...</option>
                <option value="Fundamentos de Telecomunicaciones">Fundamentos de Telecomunicaciones</option>
                <option value="Redes de Computadoras">Redes de Computadoras</option>
                <option value="Conmutación y Enrutamiento de Redes de Datos">Conmutación y Enrutamiento de Redes de Datos</option>
                <option value="Administración de Redes">Administración de Redes</option>
                <option value="Internet de las Cosas">Internet de las Cosas</option>
                <option value="Programación Web 1">Programación Web 1</option>
                <option value="Programación Web 2">Programación Web 2</option>
                <option value="Programación Web 3">Programación Web 3</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="claveMateria" class="form-label">Clave</label>
              <input type="text" id="claveMateria" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label for="docenteCorreo" class="form-label">Correo del docente</label>
              <input type="email" id="docenteCorreo" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label for="horaMateria" class="form-label">Hora</label>
              <input type="time" id="horaMateria" class="form-control" min="07:00" max="19:00" required />
            </div>
          </div>
          <div class="mt-3 text-end">
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Sección: Tabla de Materias -->
    <section class="card" aria-labelledby="titulo-tabla">
      <header class="card-header">
        <h2 id="titulo-tabla" class="h5">Listado de Materias</h2>
      </header>
      <div class="card-body p-0">
        <table class="table table-striped mb-0" id="tablaMaterias">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Clave</th>
              <th>Docente</th>
              <th>Hora</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Se llena desde JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="../../../js/controllers/MateriaController.js"></script>
</body>
</html>
