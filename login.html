<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/estilos.css" />
</head>

<body class="bg-light">

  <main class="container my-5 login-contenedor">

    <h2 class="text-center mb-4">Inicio de Sesión</h2>

    <div id="mensaje" class="alert d-none" role="alert"></div>

    <form id="loginForm" class="mb-3">
      <input type="email" id="loginCorreo" class="form-control mb-2" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Contraseña" required>
      <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
    </form>

    <hr>
    <button class="btn btn-outline-secondary w-100" data-bs-toggle="modal" data-bs-target="#modalRegistro">
      ¿No tienes cuenta? Regístrate
    </button>
  </main>

  <!-- Modal Registro -->
  <div class="modal fade" id="modalRegistro" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="registroForm">
        <div class="modal-header">
          <h5 class="modal-title">Registro de Usuario</h5>
          <button class="btn-close" data-bs-dismiss="modal" title="Cerrar"></button>

        </div>
        <div class="modal-body">
          <input type="email" id="registroCorreo" class="form-control mb-2" placeholder="Correo" required>
          <input type="password" id="registroPassword" class="form-control mb-2" placeholder="Contraseña" required>
          <select id="registroRol" class="form-select" aria-label="Rol de usuario">
            <option value="usuario">Usuario</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" type="submit">Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/controllers/LoginController.js"></script>
</body>

</html>
