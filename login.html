<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./css/estilos.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <main class="container my-5 login-contenedor">

    <header class="mb-4 text-center">
      <h2>Inicio de Sesión</h2>
    </header>

    <div id="mensaje" class="alert d-none" role="alert"></div>

    <section>
      <form id="loginForm" class="mb-3" aria-label="Formulario de inicio de sesión">
        <input type="email" id="loginCorreo" class="form-control mb-2" placeholder="Correo electrónico" required>
        <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Contraseña" required>
        <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
      </form>
    </section>
    
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/controllers/LoginController.js"></script>
</body>
</html>
