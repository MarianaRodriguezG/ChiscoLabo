<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/estilos.css" />
</head>
<body class="bg-light">

  <main class="container my-5">
    <header class="mb-4">
      <h1>Gestión de Alumnos</h1>
    </header>

    <!-- Sección: Registro de alumno -->
    <section class="card mb-4" aria-labelledby="titulo-registro">
      <header class="card-header">
        <h2 id="titulo-registro" class="h5">Registrar nuevo alumno</h2>
      </header>
      <div class="card-body">
        <form id="formUsuario">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="nombres" class="form-label">Nombre(s)</label>
              <input type="text" id="nombres" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label for="apellidoPaterno" class="form-label">Apellido paterno</label>
              <input type="text" id="apellidoPaterno" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label for="apellidoMaterno" class="form-label">Apellido materno</label>
              <input type="text" id="apellidoMaterno" class="form-control" required />
            </div>
            <div class="col-md-3">
              <label for="numeroControl" class="form-label">Número de control</label>
              <input type="text" id="numeroControl" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label for="correo" class="form-label">Correo</label>
              <input type="email" id="correo" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" required />
            </div>
            <input type="hidden" id="rol" value="alumno" />
            <div class="col-md-1 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">Guardar</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- Sección: Tabla de alumnos -->
    <section class="card" aria-labelledby="titulo-tabla">
      <header class="card-header">
        <h2 id="titulo-tabla" class="h5">Listado de Alumnos</h2>
      </header>
      <div class="card-body p-0">
        <table class="table table-striped mb-0" id="tablaUsuarios">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Nombre completo</th>
              <th>Número de control</th>
              <th>Correo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </section>

    <footer class="mt-4">
      <a href="../../../logout.html" class="btn btn-danger">Cerrar sesión</a>
    </footer>
  </main>

  <script type="module">
    import { protegerVista } from "../../../js/auth.js";
    protegerVista("admin");

    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));
    console.log("Admin activo:", usuario.correo);
  </script>

  <script type="module" src="../../../js/controllers/UsuarioController.js"></script>
</body>
</html>
